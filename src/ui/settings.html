<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Claw Desktop Settings</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <!-- The page fills the window in both of its homes: as a transparent overlay
       view on top of the Control UI, and as the main window's own content on a
       first run, when there is no gateway to overlay. The scrim renders as a
       dim wash in the first case and as a plain themed background in the
       second; the card is identical either way. See openSettings in main.js. -->
  <div class="scrim" id="scrim">
    <!-- A slim draggable band at the top edge. The rest of the scrim is a
         dismiss target, and a drag region swallows the click that would need —
         so the window stays movable without costing click-outside-to-close. -->
    <div class="dragbar"></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="title">
      <header class="modal__header">
        <div class="stack">
          <h1 id="title">Settings</h1>
          <p class="sub" id="subtitle">Choose which gateway this app connects to.</p>
        </div>
        <button class="modal__close" id="close" type="button" aria-label="Close settings" title="Close (Esc)">&#10005;</button>
      </header>
      <div class="modal__body">

  <!-- The answer to a Connect pressed on this page: the gateway is loaded and
       waiting behind here, and this is the way through to it. Empty until then,
       and empty for a page opened over a gateway that was already connected —
       nothing was asked there, so there is nothing to answer. See renderReady. -->
  <div id="ready"></div>

  <!-- Above everything else, and empty almost always. A refused certificate is
       the reason this page was opened at all when there is one — the failure
       notice links straight here — so it must not sit below Gateways and
       Behaviour, where you would have to go looking for it. -->
  <div id="cert-offers"></div>

  <h2>Gateways</h2>
  <div id="gateways"></div>

  <div class="card">
    <div class="field">
      <span>Add a gateway</span>
      <input type="text" id="new-label" placeholder="Name (e.g. home)" autocomplete="off">
    </div>
    <div class="field">
      <input type="url" id="new-url" placeholder="https://host.example.ts.net" autocomplete="off" spellcheck="false">
    </div>
    <div class="row">
      <button id="test">Test connection</button>
      <button id="add" class="primary">Add</button>
    </div>
    <div class="result" id="test-result"></div>
  </div>

  <section id="prefs" hidden>
    <h2>Behaviour</h2>
    <div class="card">
      <label class="check">
        <input type="checkbox" id="closeToTray">
        <span class="stack">
          <span>Keep running when the window is closed</span>
          <span>Closing hides the window instead of quitting. Quit from the tray or menu bar.</span>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" id="launchAtLogin">
        <span class="stack">
          <span>Open at login</span>
          <span>Start Claw Desktop automatically when you sign in.</span>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" id="startHidden">
        <span class="stack">
          <span>Start hidden in the tray</span>
          <span>Launch to the tray without showing the window.</span>
        </span>
      </label>
      <!-- The hint is rewritten by settings.js on a build that cannot install
           an update at all, where the checkbox is disabled and the reason
           matters more than the description. -->
      <label class="check" id="autoUpdate-row">
        <input type="checkbox" id="autoUpdate">
        <span class="stack">
          <span>Install updates automatically</span>
          <span id="autoUpdate-hint">Download new versions in the background and offer to restart. Off, the app still tells you when one exists and can install it on request.</span>
        </span>
      </label>
      <div class="field">
        <span>Global shortcut</span>
        <input type="text" id="globalShortcut" placeholder="CommandOrControl+Shift+O" spellcheck="false">
        <div class="muted-sm" style="margin-top:6px">
          Shows or hides the window from anywhere. Use Electron accelerator syntax, or clear it to disable.
        </div>
        <div class="result" id="shortcut-result"></div>
      </div>
      <div class="actions">
        <button id="save" class="primary">Save preferences</button>
      </div>
    </div>

    <h2>Trusted certificates</h2>
    <div id="certs"></div>
  </section>

  <!-- Outside #prefs on purpose: that section is hidden on a first run, and
       "which build is this?" is worth being able to answer during setup as
       much as after it. -->
  <hr>
  <p class="muted-sm" id="about"></p>

      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
