<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Claw Desktop Settings</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <!-- The page fills the window in both of its homes: as a transparent overlay
       view on top of the Control UI, and as the main window's own content on a
       first run, when there is no gateway to overlay. The scrim renders as a
       dim wash in the first case and as a plain themed background in the
       second; the card is identical either way. See openSettings in main.js. -->
  <div class="scrim" id="scrim">
    <!-- A slim draggable band at the top edge. The rest of the scrim is a
         dismiss target, and a drag region swallows the click that would need —
         so the window stays movable without costing click-outside-to-close. -->
    <div class="dragbar"></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="title">
      <header class="modal__header">
        <div class="stack">
          <h1 id="title">Settings</h1>
          <p class="sub" id="subtitle">Choose which gateway this app connects to.</p>
        </div>
        <button class="modal__close" id="close" type="button" aria-label="Close settings" title="Close (Esc)">&#10005;</button>
      </header>
      <div class="modal__body">

  <!-- The answer to a Connect pressed here — "loaded and waiting behind this
       page", with the way through — is not on this page. It is a notice, with
       every other thing the app has to say, now that the banner draws above the
       overlays. See announceConnected() in src/main.js. -->

  <!-- Above everything else, and empty almost always. A refused certificate is
       the reason this page was opened at all when there is one — the failure
       notice links straight here — so it must not sit below Gateways and
       Behaviour, where you would have to go looking for it. -->
  <!-- The tab labels are the section headings, which is why the <h2>s that used
       to run down the page are gone. Two names for one section is one too many,
       and the heading is the half that scrolls away. -->
  <nav class="tabs" id="tabs" role="tablist" aria-label="Settings sections">
    <button class="tab" type="button" role="tab" id="tab-gateways" aria-controls="panel-gateways" aria-selected="true">Gateways</button>
    <button class="tab" type="button" role="tab" id="tab-behaviour" aria-controls="panel-behaviour" aria-selected="false" tabindex="-1">Behaviour</button>
    <button class="tab" type="button" role="tab" id="tab-certificates" aria-controls="panel-certificates" aria-selected="false" tabindex="-1">Certificates</button>
    <button class="tab" type="button" role="tab" id="tab-problems" aria-controls="panel-problems" aria-selected="false" tabindex="-1">
      Problems<span class="tab__count" id="tab-problems-count" hidden></span>
    </button>
  </nav>

  <section class="panel" id="panel-gateways" role="tabpanel" aria-labelledby="tab-gateways" tabindex="0">
    <div id="gateways"></div>

    <div class="card">
      <div class="field">
        <span>Add a gateway</span>
        <input type="text" id="new-label" placeholder="Name (e.g. home)" autocomplete="off">
      </div>
      <div class="field">
        <input type="url" id="new-url" placeholder="https://host.example.ts.net" autocomplete="off" spellcheck="false">
      </div>
      <div class="row">
        <button id="test">Test connection</button>
        <button id="add" class="primary">Add</button>
      </div>
      <div class="result" id="test-result"></div>
    </div>
  </section>

  <!-- Still one element, because a first run hides all three of these at once:
       there is nothing to prefer, trust or have gone wrong yet. -->
  <!-- Outside #prefs, unlike the other two, because a first run is exactly
       when this is needed: a gateway on its own :18789 listener presents a
       certificate nothing has pinned yet, and refusing it is the first thing
       that happens, so this tab stays reachable during setup. -->
  <div class="panel" id="panel-certificates" role="tabpanel" aria-labelledby="tab-certificates" tabindex="0" hidden>
    <!-- First in the panel, and empty almost always. This used to sit above
         everything on the page, because a decision filed under a heading is a
         decision nobody makes. It can live behind a tab now that a refused
         certificate raises a banner, which is on screen whichever tab you are
         on and whose Review lands you right here. The banner carries the alarm;
         this carries the two fingerprints and the two answers, which is more
         than a notice can hold. -->
    <div id="cert-offers"></div>
    <div id="certs"></div>
  </div>

  <section id="prefs" hidden>
  <div class="panel" id="panel-behaviour" role="tabpanel" aria-labelledby="tab-behaviour" tabindex="0" hidden>
    <div class="card">
      <label class="check">
        <input type="checkbox" id="closeToTray">
        <span class="stack">
          <span>Keep running when the window is closed</span>
          <span>Closing hides the window instead of quitting. Quit from the tray or menu bar.</span>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" id="launchAtLogin">
        <span class="stack">
          <span>Open at login</span>
          <span>Start Claw Desktop automatically when you sign in.</span>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" id="startHidden">
        <span class="stack">
          <span>Start hidden in the tray</span>
          <span>Launch to the tray without showing the window.</span>
        </span>
      </label>
      <!-- The hint is rewritten by settings.js on a build that cannot install
           an update at all, where the checkbox is disabled and the reason
           matters more than the description. -->
      <label class="check" id="autoUpdate-row">
        <input type="checkbox" id="autoUpdate">
        <span class="stack">
          <span>Install updates automatically</span>
          <span id="autoUpdate-hint">Download new versions in the background and offer to restart. Off, the app still tells you when one exists and can install it on request.</span>
        </span>
      </label>
      <div class="field">
        <span>Global shortcut</span>
        <input type="text" id="globalShortcut" placeholder="CommandOrControl+Shift+O" spellcheck="false">
        <div class="muted-sm" style="margin-top:6px">
          Shows or hides the window from anywhere. Use Electron accelerator syntax, or clear it to disable.
        </div>
        <div class="result" id="shortcut-result"></div>
      </div>
      <div class="actions">
        <button id="save" class="primary">Save preferences</button>
      </div>
    </div>
  </div>

  <!-- What the banner said, after it stopped saying it. The banner keeps one
       notice per condition so it stays readable, which is exactly why it can
       never show that the gateway dropped five times overnight; this can. Read
       from the monthly files in userData/notice-log, so it survives a restart,
       which is the usual way the moment worth asking about passes. -->
  <div class="panel" id="panel-problems" role="tabpanel" aria-labelledby="tab-problems" tabindex="0" hidden>
    <div id="notice-history"></div>
  </div>
  </section>

  <!-- Outside #prefs on purpose: that section is hidden on a first run, and
       "which build is this?" is worth being able to answer during setup as
       much as after it. -->
  <hr>
  <p class="muted-sm" id="about"></p>

      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
