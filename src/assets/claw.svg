<!-- Claw Desktop — application icon.

     Original artwork. Three claw marks tearing across a window: the "claw"
     of the name, and the window it puts the Control UI in.

     Deliberately static, unlike what it replaces. This is rasterised into the
     Dock/Start-menu icon, where nothing animates, and a still frame that has to
     be chosen from a moving one is a frame nobody composed.

     The tile takes ~83% of the canvas rather than bleeding to the edge, which is
     the macOS icon grid's proportion — a full-bleed square reads noticeably
     larger than its neighbours in the Dock. The marks are drawn past the tile
     and clipped to it, so they run off the edges instead of stopping politely
     inside them.

     Tray artwork is a separate file (claw-tray.svg): at 16px this tile's frame
     and title-bar dots turn to mush, and a filled dark square is the wrong shape
     to hang in a menu bar. -->
<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <!-- Across the marks rather than down the tile, so the gradient reads along
         the direction of the swipe. -->
    <linearGradient id="claw" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5f5f"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <clipPath id="window">
      <rect x="10" y="10" width="100" height="100" rx="23"/>
    </clipPath>
  </defs>

  <rect x="10" y="10" width="100" height="100" rx="23" fill="url(#tile)"/>

  <g clip-path="url(#window)">
    <!-- Title bar. Enough of one to say "window" at 512px; it disappears
         gracefully into the tile at small sizes rather than fighting the marks. -->
    <circle cx="24" cy="24" r="3" fill="#3d3d3d"/>
    <circle cx="33" cy="24" r="3" fill="#333"/>
    <circle cx="42" cy="24" r="3" fill="#333"/>
    <path d="M10 38 H110" stroke="#2b2b2b" stroke-width="2"/>

    <!-- Each mark is a lens: pointed at both ends, widest in the middle, which
         is how a swipe actually cuts. Drawn twice — once fattened in near-black
         to darken the tile immediately around it, once in red on top. That halo
         is what makes the mark read as torn THROUGH the surface instead of
         painted onto it, and it is also what breaks the title bar cleanly. -->
    <g stroke="#050505" stroke-width="4.5" stroke-linejoin="round" fill="#050505">
      <path d="M79 4 C66 41 41 66 4 79 C27 52 52 27 79 4Z"/>
      <path d="M118 2 C91 53 53 91 2 118 C39 77 77 39 118 2Z"/>
      <path d="M118 39 C104 77 77 104 39 118 C63 90 90 63 118 39Z"/>
    </g>
    <g fill="url(#claw)">
      <path d="M79 4 C66 41 41 66 4 79 C27 52 52 27 79 4Z"/>
      <path d="M118 2 C91 53 53 91 2 118 C39 77 77 39 118 2Z"/>
      <path d="M118 39 C104 77 77 104 39 118 C63 90 90 63 118 39Z"/>
    </g>
  </g>

  <!-- Hairline lift, so the tile has an edge against a dark wallpaper. -->
  <rect x="10.5" y="10.5" width="99" height="99" rx="22.5" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>
