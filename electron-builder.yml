appId: com.azuretek.claw-desktop
productName: Claw Desktop
copyright: Copyright © 2026 Abi Renhart

directories:
  output: dist
  buildResources: build

# Writes src/build-info.json — the commit being packaged — before the app is
# assembled, so every build carries its own identity and Settings can show it.
# One hook covers `pack`, all three `build:*` scripts, and CI.
beforePack: scripts/build-info.js

files:
  - src/**/*
  - package.json
  - "!**/*.map"

# Unsigned on purpose: this is a personal fleet app, not a store submission.
# macOS therefore quarantines the downloaded .dmg — see README for the one-line fix.
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  identity: null
  notarize: false
  artifactName: ClawDesktop-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
  # Default is "${productName} Setup ${version}.exe". Spaces make the file painful
  # to script against — notably over the Windows node exec, which splits argv
  # without honouring quotes. ${arch} also stops electron-builder folding both
  # architectures into a single 215 MB installer; per-arch files are ~half that.
  artifactName: ClawDesktop-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Claw Desktop

linux:
  icon: build/icon.png
  category: Utility
  target: [AppImage]
