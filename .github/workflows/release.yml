name: Claw Desktop release

# Builds each platform on its own runner. Cross-building the Windows installer
# from macOS needs Wine for resource editing, so a native Windows runner is the
# supported path rather than a local convenience.
#
# Two kinds of build, named differently on purpose:
#   tag `v*`           a release. The tag must equal package.json — checked
#                      before anything is built — and the installers are
#                      published to a GitHub Release.
#   workflow_dispatch  a dev build, versioned `X.Y.Z-dev.<sha>` so its filename
#                      says which commit it is. Artifacts only, never published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Runs once, on the cheapest runner, before either platform build starts. A
  # tag that disagrees with package.json is then caught in seconds rather than
  # after two three-minute builds have produced misnamed installers.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: node scripts/build-version.js

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: macos
          - os: windows-latest
            script: build:win
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      # `extraMetadata.version` overrides the version electron-builder reads
      # from package.json, and package.json is what `artifactName` interpolates.
      # On a tag build it is identical to package.json — the version job proved
      # that — so this is a no-op there, and one mechanism covers both cases.
      - name: Build
        run: npm run ${{ matrix.script }} -- --config.extraMetadata.version=${{ needs.version.outputs.version }}
        env:
          # Unsigned by design; stop electron-builder looking for an identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: claw-desktop-${{ matrix.artifact }}-${{ needs.version.outputs.version }}
          retention-days: 30
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  release:
    needs: [version, build]
    # Must track the tag filter above; workflow_dispatch builds are dev builds
    # and are never published.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # A release that publishes with no installers attached looks finished
          # and is useless; fail loudly instead.
          fail_on_unmatched_files: true
