name: Claw Desktop release

# Builds each platform on its own runner. Cross-building the Windows installer
# from macOS needs Wine for resource editing, so a native Windows runner is the
# supported path rather than a local convenience.
#
# Three ways in, and they mean different things:
#
#   push to main       a dev build of whatever just landed, versioned
#                      `X.Y.Z-dev.<sha>`. Artifacts only, never published.
#   tag `v*`           a release. The tag must equal package.json — checked
#                      before anything is built — and the installers are
#                      published to a GitHub Release.
#   workflow_dispatch  a dev build of any ref, on demand.
#
# `paths-ignore` skips docs-only pushes. It is safe to combine with the tag
# filter: GitHub does not evaluate path filters for tag pushes, so a release can
# never be skipped by one.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Pushing three commits in a minute should build the last one, not all three.
# Tag builds are exempt: a release run must never be cancelled by anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Runs once, on the cheapest runner, before either platform build starts. It
  # settles two things: what version this build carries, and whether it should
  # happen at all. A tag that disagrees with package.json is caught here in
  # seconds rather than after two three-minute builds have produced misnamed
  # installers.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      tagged: ${{ steps.decide.outputs.tagged }}
    steps:
      # Tags are needed to spot a commit that is being released: `git push
      # --follow-tags` raises a branch event and a tag event for the same commit,
      # and only the tag one should build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: node scripts/build-version.js

  build:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: macos
          - os: windows-latest
            script: build:win
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      # scripts/build.js owns "what version is this build" for local builds and
      # CI alike. CLAW_BUILD_VERSION is the override it honours, so the version
      # job stays the authority here without CI needing its own flag — and a
      # developer running `npm run build:mac` gets the same naming scheme.
      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CLAW_BUILD_VERSION: ${{ needs.version.outputs.version }}
          # Unsigned by design until a Developer ID is configured; stop
          # electron-builder picking up a stray identity on a shared runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: claw-desktop-${{ matrix.artifact }}-${{ needs.version.outputs.version }}
          # Dev builds land on every push to main, so they expire quickly. A
          # release's artifacts are also attached to the GitHub Release, which
          # is permanent, so these are only a convenience.
          retention-days: ${{ needs.version.outputs.tagged == 'true' && 30 || 7 }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            # Update metadata, emitted because electron-builder.yml declares a
            # `publish` provider. An updater reads these to learn a release's
            # version, size and checksum; without them the release is just files.
            # `latest*` specifically, not `*.yml` — the build also drops
            # builder-debug.yml in dist/, which has no business in a release.
            dist/latest*.yml
            dist/*.blockmap

  release:
    needs: [version, build]
    # Must track the tag filter above; dev builds are never published.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # A release that publishes with no installers attached looks finished
          # and is useless; fail loudly instead.
          fail_on_unmatched_files: true
